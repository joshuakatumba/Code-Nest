services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: codenest-backend
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - DATABASE_URL=sqlite:///./codenest.db
      - SECRET_KEY=codenest-mvp-dev-secret-key-2026

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: codenest-frontend
    restart: unless-stopped
    ports:
      - "8002:5173"
    environment:
      - VITE_API_URL=http://localhost:8001/api
    depends_on:
      - backend
