<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560">
  <rect width="1000" height="560" fill="#1E293B"/>
  <rect x="80" y="50" width="520" height="280" rx="16" fill="#0F172A" stroke="#49BBBD" stroke-width="4"/>
  <text x="120" y="110" fill="#38BDF8" font-family="monospace" font-size="22">def calculate_fee(amount):</text>
  <text x="150" y="150" fill="#FACC15" font-family="monospace" font-size="22">if amount &lt;= 50000:</text>
  <text x="180" y="190" fill="#A7F3D0" font-family="monospace" font-size="22">return 500</text>
  <text x="150" y="230" fill="#A7F3D0" font-family="monospace" font-size="22">return int(amount * 0.01)</text>
  <circle cx="500" cy="340" r="75" fill="#49BBBD"/>
  <path d="M360 540 C360 430, 640 430, 640 540 Z" fill="#49BBBD"/>
</svg>
